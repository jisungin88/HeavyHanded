[/Script/Engine.CollisionProfile]
; --- 트레이스 채널 ---
; NoiseOcclusion : 소음 감쇄용 LOS. 기본 Overlap.
;                  (기본 Ignore 였을 때는 BlockAll 레벨 지오메트리가 소음을 전혀 차단하지 못했음.
;                   엔진의 BlockAll/PhysicsActor 는 CustomResponses 가 비어 있어서 커스텀 채널에
;                   대해서는 여기 DefaultResponse 를 그대로 쓴다. 그래서 Ignore 로 두면 벽이 뚫린다)
;
;                  Block 이 아니라 Overlap 인 이유 — 이 채널은 "막는" 채널이 아니라 "세는" 채널이다.
;                  LineTraceMulti 는 첫 Block 히트에서 광선을 끊고, 그보다 먼 히트를 전부 버린다
;                  (Chaos/Interface/SQTypes.h - FinishQueryHelper). 여러 개가 돌아오는 것은
;                  Overlap 응답뿐이다. Block 으로 두면 UNoiseSubsystem 이 차폐물을 아무리 세도
;                  항상 1 개라서 MaxOccluders 세팅이 통째로 죽고,
;                  벽 3겹 너머와 1겹 너머의 감쇄가 완전히 같아진다.
;
;                  기본이 Overlap 이라는 것은 곧 "명시적으로 빼지 않은 모든 것이 차폐물" 이라는 뜻이다.
;                  의자·액자·화병까지 차폐물로 잡히면 MaxOccluders(4) 가 금방 포화해서
;                  (0.5^4 = 6%) 벽 하나 너머와 잡동사니 네 개 너머가 구별되지 않는다.
;                  소리를 막을 이유가 없는 작은 메시에는 아래 Clutter 프로파일을 지정할 것.
; GuardVision    : 경비 시야 원뿔 LOS. 소음과 분리한 이유 — 유리는 시야는 통과시키고 소음은 막는다.
;                  이쪽은 "첫 장애물에서 끊긴다" 가 곧 원하는 동작이라 Block 이 맞다.
; Interaction    : E키 조준 트레이스. 상호작용 대상만 Block.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Overlap,bTraceType=True,bStaticObject=False,Name="NoiseOcclusion")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel6,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="Interaction")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel7,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="GuardVision")

; --- 오브젝트 채널 ---
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Loot")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel3,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="PlayerCharacter")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel4,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Guard")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel5,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Interactable")

; --- 프로필 ---
; 물리 시뮬레이션 중인 노획물. 충돌이 곧 소음이므로 물리 응답을 유지한다.
+Profiles=(Name="Loot",CollisionEnabled=QueryAndPhysics,ObjectTypeName="Loot",CustomResponses=((Channel="Camera",Response=ECR_Ignore),(Channel="NoiseOcclusion",Response=ECR_Ignore)),HelpMessage="물리 시뮬레이션 중인 노획물. 충돌 시 소음 발생.",bCanModify=True)

; 플레이어가 든 상태. 물리를 끄고 소켓에 어태치하며, 시야는 계속 가린다(파손형의 시야 차단 페널티).
;
; [Pawn / PlayerCharacter / Guard 만 Block] 미션 가이드 필수 요소:
;   "플레이어의 움직임과 실수로 다른 플레이어의 운반을 방해할 수 있는 요소"
;   물리를 끈 채 Attach 하면 들고 있는 물건이 아무도 못 막아서 이 요건이 성립하지 않는다.
;   그래서 캐릭터 채널만 Block 으로 되살려 '들고 가다 동료를 막는' 상황을 만든다.
;   CollisionEnabled 은 QueryOnly 그대로다 — 캐릭터 이동 스윕은 막지만 물리 응답은 없다.
;
;   운반자 본인은 자기 물건에 걸려 못 움직이므로 ALootBase 가 런타임에
;   IgnoreActorWhenMoving 으로 서로 무시시킨다. (프로파일로는 구분할 수 없다)
;
;   월드는 Overlap 유지 — 벽을 Block 하면 물건이 낀 채 캐릭터가 멈춰버린다.
;   소지 중 벽 접촉은 스윕 트레이스로 따로 감지한다.
+Profiles=(Name="CarriedLoot",CollisionEnabled=QueryOnly,ObjectTypeName="Loot",CustomResponses=((Channel="Camera",Response=ECR_Ignore),(Channel="Interaction",Response=ECR_Ignore),(Channel="NoiseOcclusion",Response=ECR_Ignore),(Channel="WorldStatic",Response=ECR_Overlap),(Channel="WorldDynamic",Response=ECR_Overlap),(Channel="Pawn",Response=ECR_Block),(Channel="PhysicsBody",Response=ECR_Overlap),(Channel="Loot",Response=ECR_Overlap),(Channel="PlayerCharacter",Response=ECR_Block),(Channel="Guard",Response=ECR_Block)),HelpMessage="플레이어가 들고 있는 노획물. 어태치 상태. 다른 캐릭터만 Block(운반 방해), 월드는 Overlap.",bCanModify=True)

; 중량형이 Physics Handle 로 들려 있는 상태. CarriedLoot 과 채널 응답은 전부 동일하고
; CollisionEnabled 만 QueryAndPhysics 다 — 물리를 계속 켠 채로 들기 때문에 QueryOnly 로 두면
; "SimulatePhysics 는 켜져 있는데 콜리전은 물리 응답이 없다" 는 모순으로 엔진이
; Invalid Simulate Options 경고를 내고 물리가 무효화된다.
+Profiles=(Name="CarriedHeavyLoot",CollisionEnabled=QueryAndPhysics,ObjectTypeName="Loot",CustomResponses=((Channel="Camera",Response=ECR_Ignore),(Channel="Interaction",Response=ECR_Ignore),(Channel="NoiseOcclusion",Response=ECR_Ignore),(Channel="WorldStatic",Response=ECR_Overlap),(Channel="WorldDynamic",Response=ECR_Overlap),(Channel="Pawn",Response=ECR_Block),(Channel="PhysicsBody",Response=ECR_Overlap),(Channel="Loot",Response=ECR_Overlap),(Channel="PlayerCharacter",Response=ECR_Block),(Channel="Guard",Response=ECR_Block)),HelpMessage="Physics Handle 로 들려 있는 중량형 노획물. CarriedLoot 과 채널은 동일, 물리만 유효하게 켠다.",bCanModify=True)

; 플레이어 캡슐. 플레이어 간 Block — 기획서 4장 "다른 플레이어와 충돌 가능"
+Profiles=(Name="PlayerCharacter",CollisionEnabled=QueryAndPhysics,ObjectTypeName="PlayerCharacter",CustomResponses=((Channel="Camera",Response=ECR_Ignore),(Channel="NoiseOcclusion",Response=ECR_Ignore),(Channel="PlayerCharacter",Response=ECR_Block)),HelpMessage="플레이어 캡슐. 플레이어끼리 서로 밀린다.",bCanModify=True)

