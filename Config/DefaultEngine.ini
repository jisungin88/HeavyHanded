; 밴 화물칸 적재 판정 볼륨 (AVanZone::LoadVolume).
;
; [Loot 만 Overlap] 이 볼륨은 "존 안에 들어왔는가" 하나만 본다. 플레이어가 밴에 타고
;   경비가 밴 옆을 지나가는 것까지 오버랩으로 받으면 서버 콜백이 의미 없이 늘어난다.
;
; [Block 이 아니라 Overlap 인 이유] Block 이면 던져 넣은 노획물이 존 경계에 튕겨 나온다.
;   기획상 '던져 넣기' 가 정식 적재 경로라 반드시 통과시켜야 한다.
;   CollisionEnabled 도 QueryOnly 다 — 물리 응답이 있으면 화물칸에 벽이 하나 생기는 셈이다.
;
; [Loot 쪽 응답은 Block 인데 왜 되는가] 두 응답이 다르면 낮은 쪽이 이긴다 (Ignore < Overlap < Block).
;   Loot 프로파일을 건드리지 않고 이쪽에서만 Overlap 으로 열 수 있는 이유다.
+Profiles=(Name="VanLoadZone",CollisionEnabled=QueryOnly,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="GuardVision",Response=ECR_Ignore),(Channel="NoiseOcclusion",Response=ECR_Ignore),(Channel="Interaction",Response=ECR_Ignore),(Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Loot",Response=ECR_Overlap),(Channel="PlayerCharacter",Response=ECR_Ignore),(Channel="Guard",Response=ECR_Ignore),(Channel="Interactable",Response=ECR_Ignore)),HelpMessage="밴 화물칸 적재 판정 볼륨. 노획물만 Overlap.",bCanModify=True)

; 카트 적재 판정 볼륨 (AHandCart::LoadVolume).
;
; VanLoadZone 과 같은 규칙이다 — 노획물만 Overlap, 나머지는 전부 Ignore.
; 프로파일을 따로 두는 것은 이름이 하는 일을 말해야 하기 때문이고, 나중에 카트 쪽만
; 응답을 바꿔야 할 때 밴 판정까지 같이 흔들리지 않게 하기 위해서다.
;
; [엔진 기본 프로파일을 쓰면 안 된다] 처음에 OverlapAllDynamic 을 썼다가 오버랩이
;   한 번도 안 왔다. Loot 은 나중에 추가한 커스텀 채널이라 엔진 프로파일에는 응답이
;   적혀 있지 않고, 그러면 채널 기본값인 Block 이 적용된다. 커스텀 채널을 상대하는
;   볼륨은 프로젝트 프로파일에서 명시적으로 열어야 한다.
+Profiles=(Name="CartLoadZone",CollisionEnabled=QueryOnly,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="GuardVision",Response=ECR_Ignore),(Channel="NoiseOcclusion",Response=ECR_Ignore),(Channel="Interaction",Response=ECR_Ignore),(Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Loot",Response=ECR_Overlap),(Channel="PlayerCharacter",Response=ECR_Ignore),(Channel="Guard",Response=ECR_Ignore),(Channel="Interactable",Response=ECR_Ignore)),HelpMessage="카트 적재 판정 볼륨. 노획물만 Overlap.",bCanModify=True)

; 밴 승차 판정 볼륨 (AVanZone::BoardVolume).
;
; [Pawn 과 PlayerCharacter 를 둘 다 연다] PlayerCharacter 하나만 열면 지금은 동작하지 않는다.
;   이 채널과 프로파일은 정의돼 있지만 **아무도 적용하지 않아서**, 플레이어 캡슐의 오브젝트
;   타입은 여전히 엔진 기본값인 Pawn 이다 (ABaseCharacter 도 BP_Brute 도 지정하지 않는다).
;   캡슐이 PlayerCharacter 프로파일을 쓰게 정리되면 Pawn 쪽은 닫아도 된다.
;
;   경비까지 걸리지만 문제되지 않는다 — 이 볼륨은 오버랩 콜백을 쓰지 않고, 상호작용이
;   들어온 그 폰 하나에 대해서만 IsOverlappingActor 로 물어본다. 경비는 PlayerState 가 없어
;   AVanZone::TryToggleBoarding 의 첫 관문에서 빠진다.
;
; [Loot 을 닫는 이유] 적재 볼륨과 같은 자리에 겹쳐 놓이므로, 여기서 Loot 을 열면
;   노획물 하나가 두 볼륨의 겹침 목록에 들어가고 그중 하나는 아무 일도 하지 않는다.
;
; [Block 이 아닌 이유] 밴 뒷칸은 걸어 들어가는 곳이다. Block 이면 승차 자체가 막힌다.
+Profiles=(Name="VanBoardZone",CollisionEnabled=QueryOnly,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="GuardVision",Response=ECR_Ignore),(Channel="NoiseOcclusion",Response=ECR_Ignore),(Channel="Interaction",Response=ECR_Ignore),(Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Overlap),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Loot",Response=ECR_Ignore),(Channel="PlayerCharacter",Response=ECR_Overlap),(Channel="Guard",Response=ECR_Ignore),(Channel="Interactable",Response=ECR_Ignore)),HelpMessage="밴 승차 판정 볼륨. 플레이어만 Overlap.",bCanModify=True)

; 의자 · 화병 · 액자 · 촛대처럼 소리를 막을 이유가 없는 소품.
; NoiseOcclusion 기본값이 Overlap 이라 이걸 안 지정하면 전부 차폐물로 계산된다.
; 물리 시뮬레이션을 하더라도 "주울 수 있는 노획물" 이 아니면 Loot 이 아니라 이쪽을 쓸 것.
+Profiles=(Name="Clutter",CollisionEnabled=QueryAndPhysics,ObjectTypeName="PhysicsBody",CustomResponses=((Channel="NoiseOcclusion",Response=ECR_Ignore),(Channel="GuardVision",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore)),HelpMessage="소품 · 잡동사니. 소음과 시야를 막지 않는다.",bCanModify=True)

