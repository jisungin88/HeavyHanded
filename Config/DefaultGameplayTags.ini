[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
ClearInvalidTags=False
FastReplication=False
InvalidTagCharacters="\"',"
NumBitsForContainerSize=6
NetIndexFirstBitSegment=16

; 태그 본문은 Config/Tags/*.ini 로 분리되어 있다.
; 이 파일에는 태그를 직접 추가하지 말 것 — 팀 작업 시 머지 충돌이 상시화된다.
; 새 태그는 해당 시스템의 Config/Tags/<System>.ini 에 추가한다.
;
;   Config/Tags/Noise.ini      소음 (기획서 3장)
;   Config/Tags/Alert.ini      경계도 4단계
;   Config/Tags/Role.ini       역할 4종
;   Config/Tags/Ability.ini    스킬 16종 + 공통 소모품 + 쿨다운
;   Config/Tags/State.ini      플레이어 상태 (과적/다운/체포/변장 …)
;   Config/Tags/Loot.ini       노획물 특성 4종 + 상태
;   Config/Tags/Equipment.ini  은신처 장비 8종
;   Config/Tags/Guard.ini      경비 종류 · 상태
;   Config/Tags/Hazard.ini     환경 방해 요소 · 협력 장치
;   Config/Tags/Phase.ini      게임 진행 단계 · 장소
;   Config/Tags/Cue.ini        GameplayCue (연출)
;   Config/Tags/Event.ini      GameplayEvent (GAS 이벤트)
